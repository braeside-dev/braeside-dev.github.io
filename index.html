<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braeside Dev</title>
    <meta name="description" content="A small group making useful things. Creators of EarHorn, an iOS baby monitor app.">

    <!-- Open Graph -->
    <meta property="og:title" content="Braeside Dev">
    <meta property="og:description" content="A small group making useful things. Creators of EarHorn, an iOS baby monitor app.">
    <meta property="og:image" content="https://braesidedev.com/earhorn/assets/earhorn_icon.png">
    <meta property="og:url" content="https://braesidedev.com">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Braeside Dev">
    <meta name="twitter:description" content="A small group making useful things. Creators of EarHorn, an iOS baby monitor app.">
    <meta name="twitter:image" content="https://braesidedev.com/earhorn/assets/earhorn_icon.png">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px 20px;
            line-height: 1.6;
            color: #222;
            background: #fafafa;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 0.1em;
            letter-spacing: 0.04em;
        }

        .tagline {
            color: #666;
            margin-top: 0;
            margin-bottom: 2em;
        }

        h2 {
            font-size: 1.2em;
            color: #444;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.3em;
            margin-top: 2em;
        }

        .product {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin: 1.2em 0;
        }

        .product img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            flex-shrink: 0;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            font-size: 1.05em;
        }

        .product-desc {
            color: #555;
            margin-top: 0.2em;
        }

        .coming-later .product-name {
            color: #555;
        }

        footer {
            margin-top: 4em;
            padding-top: 1.2em;
            border-top: 1px solid #ddd;
            font-size: 0.85em;
            color: #888;
        }

        footer a {
            color: #888;
        }
    </style>
</head>
<body>
    <h1>BRAESIDE DEV</h1>
    <p class="tagline">A small group making useful things</p>

    <h2>Coming Soon</h2>
    <div class="product">
        <img src="/earhorn/assets/earhorn_icon.png" alt="EarHorn app icon">
        <div class="product-info">
            <div class="product-name">EarHorn</div>
            <div class="product-desc">iOS app baby monitor. Two phones? Good to go.</div>
        </div>
    </div>

    <h2>Coming Later</h2>
    <div class="product coming-later">
        <div class="product-info">
            <div class="product-name">DewBoil</div>
            <div class="product-desc">iOS app for dew point and wet bulb forecasts. Live somewhere humid? This one's for you.</div>
        </div>
    </div>

    <footer>
        &copy; 2026 Braeside Dev LLC
    </footer>
</body>
</html>
